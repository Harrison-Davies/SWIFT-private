# Material parameters

# General properties
Material:
    state_type:    2               # Base phase state: fluid=0, solid=1, variable=2

# General material strength parameters
Strength:
    shear_mod:      81e9     # Shear modulus (Pa)
    bulk_mod:       129e9      # Bulk modulus (Pa)
    T_melt:         5110.9     # Melting temperature (K)
    rho_0:          3220       # (kg m^-3)
    T_m0:           2163.0     # K    
    a:              11.22e9    # Pa
    c:              3.61


# Specific material-strength schemes
ArtificialStress:
    n:             4
    epsilon:       0.2

YieldStress:
    Y_0:            1e7
    Y_M:            3.5e9
    mu_i:           1.2
    mu_d:           0.6
    yield_weakening_thermal_xi:          2.0
    yield_weakening_density_mult_param:  0.85
    yield_weakening_density_pow_param:   4

DamageShearCollins:
    brittle_to_ductile_pressure:    1.23e9  # TEMPORARY
    brittle_to_plastic_pressure:    2.35e9  # TEMPORARY
